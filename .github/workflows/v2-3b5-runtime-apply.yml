name: RARE SHIFT V2-3B5 Runtime Apply

on:
  push:
    branches:
      - feature/v2-3b5-signal-ranks-clean
    paths:
      - ".github/workflows/v2-3b5-runtime-apply.yml"
      - "scripts/apply-v2-3b5-runtime.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Guard branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feature/v2-3b5-signal-ranks-clean"
      - name: Repair helper literal escaping
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/${choice.name}/\\${choice.name}/g' scripts/apply-v2-3b5-runtime.mjs
      - name: Apply bounded runtime patch
        run: node scripts/apply-v2-3b5-runtime.mjs
      - name: Diff guard
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- scripts/apply-v2-3b5-runtime.mjs
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "games/rare-shift/src/phaser-survival.ts"
      - name: Commit runtime integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Zev"
          git config user.email "214125688+ZevlagGerald@users.noreply.github.com"
          git add games/rare-shift/src/phaser-survival.ts
          git commit -m "feat(v2-3b5): integrate SIGNAL rank runtime"
          git push origin HEAD:feature/v2-3b5-signal-ranks-clean
