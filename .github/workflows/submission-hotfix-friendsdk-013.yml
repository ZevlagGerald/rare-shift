name: RARE SHIFT Submission Hotfix FriendSDK 0.1.3

on:
  push:
    branches:
      - submission-hotfix/friendsdk-0.1.3
    paths:
      - ".github/workflows/submission-hotfix-friendsdk-013.yml"
      - ".github/workflows/publish-preview.yml"
      - "games/rare-shift/**"
      - "scripts/**"
      - "package.json"
      - "tsconfig.core.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: FriendSDK 0.1.3 + full qualified gameplay regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      FRIENDSDK_ARCHIVE: vendor/rarefriends-friendsdk-0.1.3.tgz
      FRIENDSDK_SHA256: 8f156c469a15786e3c649b35d092e86ec6242ff30415b7ee7c451763a816e789
      FRIENDSDK_URL: https://github.com/spokesz/friendsdk/releases/download/v0.1.3/rarefriends-friendsdk-0.1.3.tgz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch and verify FriendSDK v0.1.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 --output "$FRIENDSDK_ARCHIVE" "$FRIENDSDK_URL"
          printf '%s  %s\n' "$FRIENDSDK_SHA256" "$FRIENDSDK_ARCHIVE" | sha256sum --check --strict

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Verify installed FriendSDK version
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('node_modules/@rarefriends/friendsdk/package.json','utf8')); if(p.version!=='0.1.3') throw new Error('Expected FriendSDK 0.1.3, got '+p.version); console.log('FRIENDSDK_VERSION='+p.version)"

      - name: Deterministic gameplay regression
        shell: bash
        run: |
          npm run test:core
          npm run test:v2-combat
          npm run test:v2-2e-cross
          npm run test:v2-2-pointer
          npm run test:v2-3a
          npm run test:v2-3b1-delta
          npm run test:v2-3b2-vector
          npm run test:v2-3b3-orbit
          npm run test:v2-3b4-echo
          npm run test:v2-3b5-signal

      - name: ART and TypeScript qualification
        shell: bash
        run: |
          npm run test:v2-art
          npm run proof:v2-art
          npm run test:v2-art-browser
          npm run typecheck:core
          npm run typecheck

      - name: FriendSDK check build smoke
        shell: bash
        run: |
          npm run check
          npm run build
          npm run test:sdk

      - name: Full browser regression through B5
        shell: bash
        run: |
          npm run test:v2-1-browser
          npm run test:v2-2a-browser
          npm run test:v2-2b-browser
          npm run test:v2-2c-browser
          npm run test:v2-2d-browser
          npm run test:v2-2e-browser
          npm run test:v2-3b1-delta-browser
          npm run test:v2-3b2-vector-browser
          npm run test:v2-3b3-orbit-browser
          npm run test:v2-3b4-echo-browser
          npm run test:v2-3b5-signal-browser

      - name: Upload submission hotfix evidence
        uses: actions/upload-artifact@v4
        with:
          name: rare-shift-submission-hotfix-friendsdk-013-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
