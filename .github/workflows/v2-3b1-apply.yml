name: RARE SHIFT V2-3B1 bounded apply
# retry-2 after narrowing the EnemyRuntime patch anchor

on:
  push:
    branches:
      - feature/v2-3b1-delta-rank-runtime
    paths:
      - .github/workflows/v2-3b1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2-3b1-delta-rank-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact V2-3B1 patch
        run: node scripts/apply-v2-3b1-delta-runtime.mjs
      - name: Enforce bounded mutation
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected=$'games/rare-shift/src/phaser-survival.ts\ngames/rare-shift/tests/v2-combat.test.ts'
          printf 'CHANGED_FILES=\n%s\n' "$changed"
          test "$changed" = "$expected"
      - name: Commit bounded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/rare-shift/src/phaser-survival.ts games/rare-shift/tests/v2-combat.test.ts
          git commit -m "feat(v2-3b1): implement DELTA Rank II-V runtime"
          git push origin HEAD:feature/v2-3b1-delta-rank-runtime
