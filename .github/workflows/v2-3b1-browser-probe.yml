name: RARE SHIFT V2-3B1 Browser Probe

on:
  push:
    branches:
      - feature/v2-3b1-delta-ranks
    paths:
      - ".github/workflows/v2-3b1-browser-probe.yml"
      - "scripts/v2-3b1-delta-browser.mjs"
      - "games/rare-shift/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Natural DELTA Rank I-V browser probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      FRIENDSDK_ARCHIVE: vendor/rarefriends-friendsdk-0.1.2.tgz
      FRIENDSDK_SHA256: a6352e187916089b6829c5387fe87f386c5774004f181990e4e3c8ae641cfe83
      FRIENDSDK_URL: https://github.com/spokesz/friendsdk/releases/download/v0.1.2/rarefriends-friendsdk-0.1.2.tgz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fetch and verify FriendSDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 --output "$FRIENDSDK_ARCHIVE" "$FRIENDSDK_URL"
          printf '%s  %s\n' "$FRIENDSDK_SHA256" "$FRIENDSDK_ARCHIVE" | sha256sum --check --strict
      - run: npm install --no-audit --no-fund
      - run: node --check scripts/v2-3b1-delta-browser.mjs
      - run: npm run typecheck
      - run: npm run test:v2-3b1-delta
      - run: npm run test:v2-3b1-delta-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rare-shift-v2-3b1-browser-probe-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
