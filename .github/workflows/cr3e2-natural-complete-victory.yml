name: RARE SHIFT CR-3E.2 Focused Pre-Certification

on:
  push:
    branches:
      - qualification/cr3e-complete-victory-post-cr3e1
    paths:
      - ".github/workflows/cr3e2-natural-complete-victory.yml"
      - "docs/design/RARE_SHIFT_CR3E2_NATURAL_COMPLETE_VICTORY_GATE_v1.md"
      - "scripts/cr3e2-natural-complete-victory-browser.mjs"
      - "scripts/cr3e2-stage4-boss-scenario.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-precert:
    name: CR-3E.2 focused Stage-IV/boss pre-certification
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      FRIENDSDK_ARCHIVE: vendor/rarefriends-friendsdk-0.1.3.tgz
      FRIENDSDK_SHA256: 8f156c469a15786e3c649b35d092e86ec6242ff30415b7ee7c451763a816e789
      FRIENDSDK_URL: https://github.com/spokesz/friendsdk/releases/download/v0.1.3/rarefriends-friendsdk-0.1.3.tgz
      CR3E2_DRIVER_BLOB: b2ab5b0a6c3a8f4de2ec3977ec6c4d3473a2d24d

    steps:
      - name: Checkout exact focused head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify clean qualification-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "CR3E2_FOCUSED_HEAD=$(git rev-parse HEAD)"
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --short)"

          BASE=644f7900966412570d5bdd7b43b278b30b4e49de
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-list --count HEAD.."$BASE")" = "0"
          git diff --name-only "$BASE"...HEAD | tee /tmp/cr3e2-focused-files.txt
          if grep -Ev '^(\.github/workflows/cr3e2-natural-complete-victory\.yml|docs/design/RARE_SHIFT_CR3E2_NATURAL_COMPLETE_VICTORY_GATE_v1\.md|scripts/cr3e2-natural-complete-victory-browser\.mjs|scripts/cr3e2-stage4-boss-scenario\.mjs)$' /tmp/cr3e2-focused-files.txt; then
            echo "Unexpected file in CR-3E.2 focused qualification diff" >&2
            exit 1
          fi

          test -z "$(git diff --name-only "$BASE"...HEAD -- games/rare-shift)"
          for path in \
            games/rare-shift/src/phaser-survival.ts \
            games/rare-shift/src/cr3e-checkpoint-gate-core.ts \
            games/rare-shift/src/cr3e-checkpoint-phaser-runtime.ts \
            games/rare-shift/src/cr3-desync-core.ts \
            games/rare-shift/src/cr3-desync-phaser-runtime.ts \
            games/rare-shift/src/cr3-results-core.ts; do
            test "$(git rev-parse "$BASE:$path")" = "$(git rev-parse "HEAD:$path")"
          done
          test "$(git rev-parse HEAD:scripts/cr3e2-natural-complete-victory-browser.mjs)" = "$CR3E2_DRIVER_BLOB"

      - name: Syntax-check focused qualification assets
        shell: bash
        run: |
          node --check scripts/cr3e2-stage4-boss-scenario.mjs
          node --check scripts/cr3e2-natural-complete-victory-browser.mjs

      - name: Fetch and verify FriendSDK v0.1.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 --output "$FRIENDSDK_ARCHIVE" "$FRIENDSDK_URL"
          printf '%s  %s\n' "$FRIENDSDK_SHA256" "$FRIENDSDK_ARCHIVE" | sha256sum --check --strict

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Layer A — deterministic authority and regressions
        shell: bash
        run: |
          npm run test:cr-3e1
          npm run test:cr-1
          npm run test:cr-2a
          npm run test:cr-3a
          npm run test:cr-3c
          npm run test:cr-3d
          npm run test:evolution
          npm run test:core
          npm run test:v2-combat
          npm run test:v2-2e-cross
          npm run test:v2-2-pointer
          npm run test:v2-3a
          npm run test:v2-3b1-delta
          npm run test:v2-3b2-vector
          npm run test:v2-3b3-orbit
          npm run test:v2-3b4-echo
          npm run test:v2-3b5-signal

      - name: TypeScript qualification
        shell: bash
        run: |
          npm run typecheck:core
          npm run typecheck

      - name: FriendSDK check and build
        shell: bash
        run: |
          npm run check
          npm run build

      - name: Layer B — Stage-IV handoff and boss production-core composition
        run: node --experimental-strip-types scripts/cr3e2-stage4-boss-scenario.mjs

      - name: Layer C1 — boss legality browser integration
        run: npm run test:cr-3b-browser

      - name: Layer C2 — boss pressure browser integration
        run: npm run test:cr-3c-browser

      - name: Layer C3 — victory Results reconstruction retry and reduced-motion integration
        run: npm run test:cr-3d-browser

      - name: Layer C4 — checkpoint runtime browser integration
        run: npm run test:cr-3e1-browser

      - name: Report focused pre-certification
        shell: bash
        run: |
          set -euo pipefail
          echo "RARE_SHIFT_CR3E2_LAYER_A=PASS"
          echo "RARE_SHIFT_CR3E2_LAYER_B_STAGE4_BOSS=PASS"
          echo "RARE_SHIFT_CR3E2_LAYER_C_BROWSER_INTEGRATION=PASS"
          echo "RARE_SHIFT_CR3E2_FOCUSED_PRECERT=PASS"
          echo "RARE_SHIFT_CR3E2_FINAL_NATURAL_CERTIFICATION=HOLD"
          echo "CR3E2_FOCUSED_HEAD=$(git rev-parse HEAD)"
          test -z "$(git diff --name-only -- games/rare-shift)"
