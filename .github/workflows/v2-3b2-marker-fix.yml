name: V2-3B2 inherited marker repair

on:
  push:
    branches:
      - feature/v2-3b2-vector-ranks
    paths:
      - ".github/workflows/v2-3b2-marker-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore inherited V2-2A marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("games/rare-shift/src/phaser-survival.ts")
          text = p.read_text()
          old = 'canvas.dataset.vectorInFlight = String(this.activeVectorProjectileCount()); canvas.dataset.vectorProfile = this.vectorOwned ? `rank${this.vectorRank}-phase-precision` : "unowned";'
          new = 'canvas.dataset.vectorInFlight = String(this.activeVectorProjectileCount()); canvas.dataset.vectorProfile = this.vectorOwned && this.vectorRank > 1 ? `rank${this.vectorRank}-phase-precision` : "rank1-phase-targeted";'
          if text.count(old) != 1:
              raise SystemExit(f"expected one inherited marker seam, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))
          Path(".github/workflows/v2-3b2-marker-fix.yml").unlink()
          PY
          git diff --check
          git config user.name "Zev"
          git config user.email "214125688+ZevlagGerald@users.noreply.github.com"
          git add -A
          git commit -m "fix(v2-3b2): preserve Rank-I VECTOR browser marker"
          git push origin HEAD:feature/v2-3b2-vector-ranks
