name: RARE SHIFT CR-3E.2 Spatial Final Certification

on:
  push:
    branches:
      - qualification/cr3e-complete-victory-post-cr3e1
    paths:
      - ".github/workflows/cr3e2-spatial-final-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spatial-final-certification:
    name: CR-3E.2 spatially stable natural complete-victory certification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      FRIENDSDK_ARCHIVE: vendor/rarefriends-friendsdk-0.1.3.tgz
      FRIENDSDK_SHA256: 8f156c469a15786e3c649b35d092e86ec6242ff30415b7ee7c451763a816e789
      FRIENDSDK_URL: https://github.com/spokesz/friendsdk/releases/download/v0.1.3/rarefriends-friendsdk-0.1.3.tgz
      CR3E2_DRIVER_BLOB: b2ab5b0a6c3a8f4de2ec3977ec6c4d3473a2d24d
      CR3E2_STAGE4_SCENARIO_BLOB: a9a752a2ce2c35f48a1c4fabc0f3dbf29a032ebf
      FOCUSED_PRECERT_HEAD: 434a04f6caae2f299e7ba60c66a71b6870febb0b
      FOCUSED_PRECERT_RUN: "37092976921"

    steps:
      - name: Checkout exact spatial-certification head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify qualification-only boundary
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "CR3E2_SPATIAL_HEAD=$(git rev-parse HEAD)"
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --short)"
          BASE=644f7900966412570d5bdd7b43b278b30b4e49de
          git merge-base --is-ancestor "$BASE" HEAD
          git merge-base --is-ancestor "$FOCUSED_PRECERT_HEAD" HEAD
          git diff --name-only "$BASE"...HEAD | tee /tmp/cr3e2-spatial-files.txt
          if grep -Ev '^(\.github/workflows/cr3e2-natural-complete-victory\.yml|\.github/workflows/cr3e2-active-time-certification\.yml|\.github/workflows/cr3e2-spatial-final-certification\.yml|docs/design/RARE_SHIFT_CR3E2_NATURAL_COMPLETE_VICTORY_GATE_v1\.md|scripts/cr3e2-natural-complete-victory-browser\.mjs|scripts/cr3e2-stage4-boss-scenario\.mjs)$' /tmp/cr3e2-spatial-files.txt; then
            echo "Unexpected file in CR-3E.2 spatial qualification diff" >&2
            exit 1
          fi
          test -z "$(git diff --name-only "$BASE"...HEAD -- games/rare-shift)"
          for path in \
            games/rare-shift/src/phaser-survival.ts \
            games/rare-shift/src/phaser-survival-base.ts \
            games/rare-shift/src/cr1-director-core.ts \
            games/rare-shift/src/cr3e-checkpoint-gate-core.ts \
            games/rare-shift/src/cr3e-checkpoint-phaser-runtime.ts \
            games/rare-shift/src/cr3-desync-core.ts \
            games/rare-shift/src/cr3-desync-phaser-runtime.ts \
            games/rare-shift/src/cr3-results-core.ts; do
            test "$(git rev-parse "$BASE:$path")" = "$(git rev-parse "HEAD:$path")"
          done
          test "$(git rev-parse HEAD:scripts/cr3e2-natural-complete-victory-browser.mjs)" = "$CR3E2_DRIVER_BLOB"
          test "$(git rev-parse HEAD:scripts/cr3e2-stage4-boss-scenario.mjs)" = "$CR3E2_STAGE4_SCENARIO_BLOB"

      - name: Fetch and verify FriendSDK v0.1.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 --output "$FRIENDSDK_ARCHIVE" "$FRIENDSDK_URL"
          printf '%s  %s\n' "$FRIENDSDK_SHA256" "$FRIENDSDK_ARCHIVE" | sha256sum --check --strict

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Reconfirm deterministic and focused authority
        shell: bash
        run: |
          npm run test:cr-3e1
          npm run test:cr-1
          npm run test:cr-3a
          npm run test:cr-3d
          npm run typecheck:core
          npm run typecheck
          npm run check
          npm run build
          node --experimental-strip-types scripts/cr3e2-stage4-boss-scenario.mjs

      - name: Stage-I spatial reproducibility gate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { resolve } from "node:path";
          import { testGame } from "@rarefriends/friendsdk/testing";
          const gameDirectory = resolve("games/rare-shift");
          const snapshots = [];
          const read = canvas => canvas.evaluate(element => ({
            elapsed: Number(element.dataset.directorElapsedMs ?? "0"), progress: Number(element.dataset.directorProgressMs ?? "0"),
            hp: Number(element.dataset.hp ?? "0"), level: Number(element.dataset.level ?? "1"), kills: Number(element.dataset.kills ?? "0"),
            shifts: Number(element.dataset.shifts ?? "0"), x: Number(element.dataset.x ?? "0"), y: Number(element.dataset.y ?? "0"),
            dead: element.dataset.dead === "true", draftOpen: element.dataset.draftOpen === "true",
            draftIds: (element.dataset.draftIds ?? "").split(",").filter(Boolean), draftCount: Number(element.dataset.draftCount ?? "0"),
            activeEnemies: Number(element.dataset.activeEnemies ?? "0"), gateActive: element.dataset.checkpointGateActive ?? "",
            gateRuntime: element.dataset.cr3e1CheckpointRuntime ?? "",
          }));
          const centers = count => count === 1 ? [480] : count === 2 ? [350, 610] : [220, 480, 740];
          async function clearDraft(page, canvas, state) {
            const onboarding = new Map([[2, "ORBIT_NODES"], [3, "ECHO_MINE"], [4, "SIGNAL_ARC"]]);
            const wanted = onboarding.get(state.level);
            let index = wanted ? state.draftIds.indexOf(wanted) : 0;
            if (index < 0) index = 0;
            const box = await canvas.boundingBox(); assert.ok(box);
            await canvas.click({ position: { x: box.width * centers(state.draftCount)[index] / 960, y: box.height * 320 / 640 }, timeout: 2_500 });
            await page.waitForTimeout(80);
          }
          async function holdActive(page, canvas, key, activeMs) {
            const start = await read(canvas); const target = start.elapsed + activeMs; const wallDeadline = Date.now() + 4_000;
            await page.keyboard.down(key);
            try {
              while (Date.now() < wallDeadline) {
                await page.waitForTimeout(16); const state = await read(canvas);
                if (state.elapsed >= target || state.dead || state.draftOpen) return;
              }
              throw new Error(`active-time hold stalled: ${key} target=${target}`);
            } finally { await page.keyboard.up(key); }
          }
          function attempt(label) {
            return async ({ page, game }) => {
              const scan = game.locator('[data-stage="scan"]'); await scan.waitFor({ state: "visible" });
              const frameA = Number(await scan.getAttribute("data-frame-a")); const frameB = Number(await scan.getAttribute("data-frame-b"));
              await game.getByRole("button", { name: /ENTER SIGNAL DESCENT/i }).click();
              const canvas = game.locator("canvas[data-director-stage]").first(); await canvas.waitFor({ state: "visible" }); await canvas.focus();
              const runtimeDeadline = Date.now() + 10_000;
              while (Date.now() < runtimeDeadline && await canvas.getAttribute("data-cr3e1-checkpoint-runtime") !== "ACTIVE") await page.waitForTimeout(50);
              assert.equal(await canvas.getAttribute("data-cr3e1-checkpoint-runtime"), "ACTIVE");
              let tick = 0; const deadline = Date.now() + 120_000;
              while (Date.now() < deadline) {
                const state = await read(canvas);
                if (state.dead) throw new Error(`${label} died before ELITE_I: ${JSON.stringify(state)}`);
                if (state.progress >= 80_000 || state.gateActive === "ELITE_I") {
                  snapshots.push({ label, frameA, frameB, ...state });
                  console.log(`CR3E2_SPATIAL_${label}=${JSON.stringify(snapshots.at(-1))}`); return;
                }
                if (state.draftOpen) { await clearDraft(page, canvas, state); continue; }
                let key;
                if (state.y < 250 && state.x < 1500) key = "ArrowRight";
                else if (state.x >= 1500 && state.y < 950) key = "ArrowDown";
                else if (state.y >= 950 && state.x > 300) key = "ArrowLeft";
                else if (state.x <= 300 && state.y > 250) key = "ArrowUp";
                else key = "ArrowUp";
                await holdActive(page, canvas, key, 420); tick += 1;
                if (tick % 7 === 0) { await canvas.press("Space", { timeout: 2_500 }); await page.waitForTimeout(105); }
                await page.waitForTimeout(45);
              }
              throw new Error(`${label} did not reach ELITE_I`);
            };
          }
          for (const label of ["A", "B"]) await testGame(gameDirectory, { width: 960, height: 800, timeout: 135_000, check: attempt(label) });
          assert.equal(snapshots.length, 2); const [a, b] = snapshots;
          assert.equal(a.frameA, b.frameA); assert.equal(a.frameB, b.frameB); assert.equal(a.progress, 80_000); assert.equal(b.progress, 80_000);
          assert.ok(Math.abs(a.hp - b.hp) <= 15, `HP variance too high: ${a.hp} vs ${b.hp}`);
          assert.ok(Math.abs(a.kills - b.kills) <= 12, `kill variance too high: ${a.kills} vs ${b.kills}`);
          assert.ok(Math.abs(a.activeEnemies - b.activeEnemies) <= 12, `enemy variance too high: ${a.activeEnemies} vs ${b.activeEnemies}`);
          assert.ok(Math.hypot(a.x - b.x, a.y - b.y) <= 180, `position variance too high: (${a.x},${a.y}) vs (${b.x},${b.y})`);
          assert.ok(Math.abs(a.shifts - b.shifts) <= 1, `SHIFT variance too high: ${a.shifts} vs ${b.shifts}`);
          console.log("RARE_SHIFT_CR3E2_SPATIAL_REPRO=PASS");
          NODE

      - name: Apply spatially stable Run-17 policy and Stage-IV-only phase awareness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/cr3e2-natural-complete-victory-browser.mjs)" = "$CR3E2_DRIVER_BLOB"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "scripts/cr3e2-natural-complete-victory-browser.mjs";
          let source = readFileSync(path, "utf8");
          const replaceOnce = (before, after, label) => { if (source.split(before).length !== 2) throw new Error(`${label} anchor drifted`); source = source.replace(before, after); };

          replaceOnce(`  await canvas.click({ position: { x: box.width * centers(count)[index] / 960, y: box.height * 320 / 640 } });`, `  await canvas.click({ position: { x: box.width * centers(count)[index] / 960, y: box.height * 320 / 640 }, timeout: 2_500 });`, "draft click");
          replaceOnce(`  const criticalRefract = state.level >= 5\n    && state.hp <= 35\n    && state.cr2DraftActive\n    && state.refracts > 0\n    && !state.draftIds.includes("FIELD_REPAIR");`, `  const criticalRefract = state.level >= 5\n    && state.hp <= 25\n    && state.cr2DraftActive\n    && state.refracts > 0\n    && !state.draftIds.includes("FIELD_REPAIR");`, "REFRACT");
          replaceOnce(`    await canvas.press("r");`, `    await canvas.press("r", { timeout: 2_500 });`, "REFRACT input");

          const priorityNeedle = `  const lowHp = state.hp <= 72;\n  const priority = lowHp\n    ? [`;
          const priorityReplacement = `  const pressureDraft = state.level >= 5 && (state.hp <= 60 || state.activeEnemies >= 32);\n  const lowHp = state.hp <= 72;\n  const priority = pressureDraft\n    ? [\n        "FIELD_REPAIR",\n        "PROTOCOL_ORBIT_STABILIZER",\n        "PROTOCOL_VECTOR_LENS",\n        "PROTOCOL_COMMON_CORE",\n        "DELTA_RANK",\n        "SIGNAL_RANK",\n        "ORBIT_RANK",\n        "ECHO_RANK",\n        "PROTOCOL_RESONANCE_COIL",\n        "PROTOCOL_MEMORY_FUSE",\n        "SIGNAL_MAGNET",\n        "EVOLUTION",\n        "VECTOR_RANK",\n        "ORBIT_NODES",\n        "ECHO_MINE",\n        "SIGNAL_ARC",\n        "VECTOR_NEEDLE",\n      ]\n    : lowHp\n    ? [`;
          replaceOnce(priorityNeedle, priorityReplacement, "pressure priority");

          const laneNeedle = `async function moveNaturalSurvivalLane(canvas, state, tick) {\n  const x = state.x;\n  const y = state.y;\n  let key;\n  if (y < 250 && x < 1500) key = "ArrowRight";\n  else if (x >= 1500 && y < 950) key = "ArrowDown";\n  else if (y >= 950 && x > 300) key = "ArrowLeft";\n  else if (x <= 300 && y > 250) key = "ArrowUp";\n  else key = ["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp"][Math.floor(tick / 10) % 4];\n  const postStageOne = state.stage !== "STAGE_I";\n  await canvas.press(key, { delay: postStageOne ? 520 : 420 });\n  return { settle: postStageOne ? 80 : 0, shiftModulo: 7 };\n}`;
          const laneReplacement = `async function holdKeyForActiveMs(page, canvas, key, activeMs) {\n  const start = await readState(canvas);\n  const targetElapsed = start.elapsed + activeMs;\n  const wallDeadline = Date.now() + 4_000;\n  await page.keyboard.down(key);\n  try {\n    while (Date.now() < wallDeadline) {\n      await page.waitForTimeout(16);\n      const current = await readCombatState(canvas);\n      if (!current || current.dead || current.draftOpen || current.elapsed >= targetElapsed) return;\n    }\n    throw new Error(\`active-time movement stalled for \${key} target=\${targetElapsed}\`);\n  } finally { await page.keyboard.up(key); }\n}\n\nfunction shouldStageFourShift(state, periodicDue) {\n  const stageFour = state.stage === "STAGE_IV" && state.gateResolvedCount >= 3 && state.gatePhase === "RUNNING" && !state.bossActive && !state.bossPending;\n  if (!stageFour) return periodicDue;\n  const aThreats = state.enemyKinds.filter(kind => kind === "SPLIT_A" || kind === "FLICKER_A").length;\n  const bThreats = state.enemyKinds.filter(kind => kind === "SPLIT_B" || kind === "FLICKER_B").length;\n  const current = state.phase === "A" ? aThreats : bThreats;\n  const alternate = state.phase === "A" ? bThreats : aThreats;\n  return alternate + 2 <= current;\n}\n\nasync function moveNaturalSurvivalLane(page, canvas, state, tick) {\n  const x = state.x; const y = state.y; let key;\n  if (y < 250 && x < 1500) key = "ArrowRight";\n  else if (x >= 1500 && y < 950) key = "ArrowDown";\n  else if (y >= 950 && x > 300) key = "ArrowLeft";\n  else if (x <= 300 && y > 250) key = "ArrowUp";\n  else key = "ArrowUp";\n  const postStageOne = state.stage !== "STAGE_I";\n  await holdKeyForActiveMs(page, canvas, key, postStageOne ? 520 : 420);\n  const pressureShift = postStageOne && (state.activeEnemies >= 32 || state.hp <= 25);\n  return { settle: postStageOne ? 80 : 0, shiftModulo: pressureShift ? 5 : 7 };\n}`;
          replaceOnce(laneNeedle, laneReplacement, "spatial lane");

          replaceOnce(`async function moveEliteCombatLane(canvas, state, tick) {`, `async function moveEliteCombatLane(page, canvas, state, tick) {`, "elite signature");
          replaceOnce(`  await canvas.press(key, { delay: 180 });\n}\n\nasync function moveTowardPoint(canvas, state, point) {`, `  await holdKeyForActiveMs(page, canvas, key, 180);\n}\n\nasync function moveTowardPoint(page, canvas, state, point) {`, "elite movement");
          source = source.replace(`    await canvas.press("ArrowRight", { delay: 80 });`, `    await holdKeyForActiveMs(page, canvas, "ArrowRight", 80);`);
          source = source.replace(`  await canvas.press(key, { delay: 150 });`, `  await holdKeyForActiveMs(page, canvas, key, 150);`);
          source = source.replaceAll(`await moveNaturalSurvivalLane(canvas, state, moveTick)`, `await moveNaturalSurvivalLane(page, canvas, state, moveTick)`);
          source = source.replace(`await moveEliteCombatLane(canvas, state, checkpointTick)`, `await moveEliteCombatLane(page, canvas, state, checkpointTick)`);
          source = source.replace(`await moveTowardPoint(canvas, state, lastCheckpointPosition)`, `await moveTowardPoint(page, canvas, state, lastCheckpointPosition)`);

          const periodic = `if (moveTick % movement.shiftModulo === 0) await shiftAndObserve();`;
          if (source.split(periodic).length !== 3) throw new Error("periodic SHIFT anchors drifted");
          source = source.replaceAll(periodic, `if (shouldStageFourShift(state, moveTick % movement.shiftModulo === 0)) await shiftAndObserve();`);
          replaceOnce(`      await canvas.press("Space");`, `      await canvas.press("Space", { timeout: 2_500 });`, "SHIFT");
          writeFileSync(path, source);
          NODE
          node --check scripts/cr3e2-natural-complete-victory-browser.mjs
          git diff --check -- scripts/cr3e2-natural-complete-victory-browser.mjs
          test -z "$(git diff --name-only -- games/rare-shift)"
          echo "RARE_SHIFT_CR3E2_SPATIAL_ROUTE=YES"
          echo "RARE_SHIFT_CR3E2_RUN17_BUILD_POLICY=YES"
          echo "RARE_SHIFT_CR3E2_STAGE4_PHASE_AWARE_ONLY=YES"

      - name: Final natural complete-victory certification
        run: node --experimental-strip-types scripts/cr3e2-natural-complete-victory-browser.mjs

      - name: Restore committed natural driver
        if: always()
        shell: bash
        run: |
          git checkout -- scripts/cr3e2-natural-complete-victory-browser.mjs
          test "$(git hash-object scripts/cr3e2-natural-complete-victory-browser.mjs)" = "$CR3E2_DRIVER_BLOB"

      - name: Report final qualification
        shell: bash
        run: |
          set -euo pipefail
          echo "RARE_SHIFT_CR3E2_SPATIAL_REPRO=PASS"
          echo "RARE_SHIFT_CR3E2_FOCUSED_PRECERT_HEAD=$FOCUSED_PRECERT_HEAD"
          echo "RARE_SHIFT_CR3E2_FOCUSED_PRECERT_RUN=$FOCUSED_PRECERT_RUN"
          echo "RARE_SHIFT_CR3E2_FINAL_NATURAL_CERTIFICATION=PASS"
          echo "CR3E2_FINAL_HEAD=$(git rev-parse HEAD)"
          test -z "$(git diff --name-only -- games/rare-shift)"
          test "$(git hash-object scripts/cr3e2-natural-complete-victory-browser.mjs)" = "$CR3E2_DRIVER_BLOB"
