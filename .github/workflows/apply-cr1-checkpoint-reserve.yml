name: CR-1 Checkpoint Capacity Repair

on:
  push:
    branches:
      - ops/cr1-checkpoint-reserve-fix
    paths:
      - ".github/workflows/apply-cr1-checkpoint-reserve.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CR-1 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cr-1-survival-director
          fetch-depth: 0

      - name: Apply bounded checkpoint-only repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core_path = Path('games/rare-shift/src/cr1-director-core.ts')
          core = core_path.read_text()
          reserve_block = '''export const CR1_RESERVED_CHECKPOINT_SLOTS = 3 as const;\n\nexport function canSpawnRegularEnemy(activeRegularEnemies: number, maxActiveEnemies: number): boolean {\n  if (!Number.isInteger(activeRegularEnemies) || activeRegularEnemies < 0) throw new Error("activeRegularEnemies must be a non-negative integer.");\n  if (!Number.isInteger(maxActiveEnemies) || maxActiveEnemies < CR1_RESERVED_CHECKPOINT_SLOTS) throw new Error("maxActiveEnemies must reserve all CR-1 checkpoint slots.");\n  if (CR1_RESERVED_CHECKPOINT_SLOTS !== CR1_CHECKPOINTS.length) throw new Error("CR-1 checkpoint reserve must match checkpoint count.");\n  return activeRegularEnemies < maxActiveEnemies - CR1_RESERVED_CHECKPOINT_SLOTS;\n}\n\n'''
          if reserve_block not in core:
              raise SystemExit('expected prior reserve block not found')
          core = core.replace(reserve_block, '', 1)
          selector_anchor = ''']);\n\nexport function stageForElapsedMs'''
          selector_replacement = ''']);\n\nexport function selectCheckpointSpawnSlotIndex(\n  slots: readonly { readonly active: boolean; readonly elite: boolean }[],\n): number {\n  const inactiveIndex = slots.findIndex(slot => !slot.active);\n  if (inactiveIndex >= 0) return inactiveIndex;\n  return slots.findIndex(slot => slot.active && !slot.elite);\n}\n\nexport function stageForElapsedMs'''
          if selector_anchor not in core:
              raise SystemExit('checkpoint selector anchor mismatch')
          core_path.write_text(core.replace(selector_anchor, selector_replacement, 1))

          runtime_path = Path('games/rare-shift/src/phaser-survival.ts')
          runtime = runtime_path.read_text()
          import_old = '''  buildDirectedSpawnSpec,\n  canSpawnRegularEnemy,\n  claimCheckpointRewards,'''
          import_new = '''  buildDirectedSpawnSpec,\n  claimCheckpointRewards,\n  selectCheckpointSpawnSlotIndex,'''
          if import_old not in runtime:
              raise SystemExit('runtime reserve import mismatch')
          runtime = runtime.replace(import_old, import_new, 1)

          checkpoint_old = '''  private spawnCheckpoint(checkpointId: CR1CheckpointId, kind: V2EnemyKind, hpMultiplier: number, label: string): boolean {\n    const slot = this.enemies.find(enemy => !enemy.active);\n    if (!slot) return false;\n    const position = buildCheckpointSpawnPosition(this.seed, checkpointId, { x: this.friend.x, y: this.friend.y });\n    this.activateEnemy(slot, this.spawnIndex++, kind, position.x, position.y, true, checkpointId, hpMultiplier);\n    this.statusText.setText(label);\n    return true;\n  }\n\n  private spawnEnemy(): void {\n    const activeRegularEnemies = this.enemies.filter(enemy => enemy.active && !enemy.elite).length;\n    if (!canSpawnRegularEnemy(activeRegularEnemies, this.enemies.length)) return;\n    const slot = this.enemies.find(enemy => !enemy.active);\n    if (!slot) return;\n    const spec = buildDirectedSpawnSpec(this.seed, this.spawnIndex, this.elapsedActiveMs, { x: this.friend.x, y: this.friend.y });'''
          checkpoint_new = '''  private spawnCheckpoint(checkpointId: CR1CheckpointId, kind: V2EnemyKind, hpMultiplier: number, label: string): boolean {\n    const slotIndex = selectCheckpointSpawnSlotIndex(this.enemies);\n    if (slotIndex < 0) return false;\n    const slot = this.enemies[slotIndex];\n    if (slot.active) this.retireRegularEnemyForCheckpoint(slot);\n    const position = buildCheckpointSpawnPosition(this.seed, checkpointId, { x: this.friend.x, y: this.friend.y });\n    this.activateEnemy(slot, this.spawnIndex++, kind, position.x, position.y, true, checkpointId, hpMultiplier);\n    this.statusText.setText(label);\n    return true;\n  }\n\n  private retireRegularEnemyForCheckpoint(enemy: EnemyRuntime): void {\n    if (!enemy.active || enemy.elite) throw new Error("checkpoint replacement requires an active regular enemy.");\n    const retiredId = enemy.id;\n    this.orbitLastHitAt.delete(retiredId);\n    if (this.vectorTargetId === retiredId) {\n      this.vectorTargetId = null;\n      this.vectorTargetKind = null;\n      this.vectorReticle.setVisible(false);\n    }\n    if (this.vectorRank >= 5 && this.vectorLockState.targetId === retiredId) this.resetVectorLockState();\n    enemy.active = false;\n    enemy.view.setVisible(false);\n    enemy.telegraphView.clear().setVisible(false);\n    enemy.healthView.clear().setVisible(false);\n  }\n\n  private spawnEnemy(): void {\n    const slot = this.enemies.find(enemy => !enemy.active);\n    if (!slot) return;\n    const spec = buildDirectedSpawnSpec(this.seed, this.spawnIndex, this.elapsedActiveMs, { x: this.friend.x, y: this.friend.y });'''
          if checkpoint_old not in runtime:
              raise SystemExit('runtime checkpoint/spawn anchor mismatch')
          runtime_path.write_text(runtime.replace(checkpoint_old, checkpoint_new, 1))

          test_path = Path('games/rare-shift/tests/cr-1-survival-director.test.ts')
          tests = test_path.read_text()
          import_old = '''  CR1_CHECKPOINTS,\n  CR1_RESERVED_CHECKPOINT_SLOTS,\n  CR1_STAGES,\n  buildDirectedSpawnSpec,\n  canSpawnRegularEnemy,'''
          import_new = '''  CR1_CHECKPOINTS,\n  CR1_STAGES,\n  buildDirectedSpawnSpec,'''
          if import_old not in tests:
              raise SystemExit('test reserve import mismatch')
          tests = tests.replace(import_old, import_new, 1)
          import_anchor = '''  nextFlickerKind,\n  stageForElapsedMs,'''
          import_replacement = '''  nextFlickerKind,\n  selectCheckpointSpawnSlotIndex,\n  stageForElapsedMs,'''
          if import_anchor not in tests:
              raise SystemExit('test selector import anchor mismatch')
          tests = tests.replace(import_anchor, import_replacement, 1)

          reserve_test = '''test("CR-1 ordinary spawning reserves capacity for all mandatory checkpoints", () => {\n  assert.equal(CR1_RESERVED_CHECKPOINT_SLOTS, 3);\n  assert.equal(CR1_RESERVED_CHECKPOINT_SLOTS, CR1_CHECKPOINTS.length);\n  assert.equal(canSpawnRegularEnemy(44, 48), true);\n  assert.equal(canSpawnRegularEnemy(45, 48), false);\n  assert.equal(canSpawnRegularEnemy(46, 48), false);\n  assert.throws(() => canSpawnRegularEnemy(-1, 48), /non-negative integer/u);\n  assert.throws(() => canSpawnRegularEnemy(0, 2), /reserve all CR-1 checkpoint slots/u);\n});'''
          selector_test = '''test("CR-1 checkpoint slot selection preserves ordinary capacity and reclaims only regular enemies", () => {\n  assert.equal(selectCheckpointSpawnSlotIndex([\n    { active: true, elite: false },\n    { active: false, elite: false },\n    { active: true, elite: true },\n  ]), 1);\n  assert.equal(selectCheckpointSpawnSlotIndex([\n    { active: true, elite: true },\n    { active: true, elite: false },\n    { active: true, elite: false },\n  ]), 1);\n  assert.equal(selectCheckpointSpawnSlotIndex([\n    { active: true, elite: true },\n    { active: true, elite: true },\n  ]), -1);\n});'''
          if reserve_test not in tests:
              raise SystemExit('reserve test body mismatch')
          test_path.write_text(tests.replace(reserve_test, selector_test, 1))
          PY

          git diff --check
          node --experimental-strip-types --test games/rare-shift/tests/cr-1-survival-director.test.ts
          if grep -R "canSpawnRegularEnemy\|CR1_RESERVED_CHECKPOINT_SLOTS" games/rare-shift/src games/rare-shift/tests; then
            echo "Broad reserve repair residue remains"
            exit 1
          fi
          git diff -- games/rare-shift/src/cr1-director-core.ts games/rare-shift/src/phaser-survival.ts games/rare-shift/tests/cr-1-survival-director.test.ts

      - name: Commit and push repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/rare-shift/src/cr1-director-core.ts games/rare-shift/src/phaser-survival.ts games/rare-shift/tests/cr-1-survival-director.test.ts
          git diff --cached --quiet && { echo "No repair diff produced"; exit 1; }
          git commit -m "fix(cr-1): make checkpoints claim saturated regular slots"
          git push origin HEAD:feature/cr-1-survival-director
