name: CR-1 Apply Runtime Patch

on:
  push:
    branches:
      - feature/cr-1-survival-director
    paths:
      - scripts/cr1-apply-runtime-patch.mjs
      - .github/workflows/cr1-apply-runtime-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply anchor-checked CR-1 runtime patch
        run: node scripts/cr1-apply-runtime-patch.mjs
      - name: Verify bounded runtime-only patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf 'CHANGED=%s\n' "$changed"
          test "$changed" = "games/rare-shift/src/phaser-survival.ts"
      - name: Commit generated runtime integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/rare-shift/src/phaser-survival.ts
          git commit -m "feat(cr-1): integrate survival director runtime"
          git push origin HEAD:feature/cr-1-survival-director
