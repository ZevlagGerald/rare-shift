          test("VECTOR launch plans snapshot rank behavior and reject invalid rank state", () => {
            const candidates = [{ id: 1, kind: "TRACE" as const, active: true, x: 100, y: 0 }];
            const oldPlan = planVectorShot(candidates, "A", 0, 0, 2, 1);
            const newPlan = planVectorShot(candidates, "A", 0, 0, 5, 1, { lockStacks: 3 });
            assert.equal(oldPlan.rank, 2);
            assert.deepEqual(oldPlan.targets.map(target => target.damage), [10]);
            assert.equal(newPlan.rank, 5);
            assert.deepEqual(newPlan.targets.map(target => target.damage), [16]);
            assert.throws(() => buildVectorRankProfile(0), /integer from 1 to 5/u);
            assert.throws(() => buildVectorRankProfile(6), /integer from 1 to 5/u);
          });

          test("bounded live adapter exposes natural VECTOR I->II and matches normalized progression semantics", () => {
            const liveBase = { deltaRank: 1, hp: 70, maxHp: 100, pickupRadius: 76, vectorEnabled: true, vectorOwned: false, orbitEnabled: true, orbitOwned: false, echoEnabled: true, echoOwned: false, weaponSlotsUsed: 1, weaponSlotCap: 4 };
            const acquired = applyV21Draft(liveBase, "VECTOR_NEEDLE");
            assert.equal(acquired.vectorRank, 1);
            const nextDraft = buildV21Draft(13699, 3, acquired);
            assert.ok(nextDraft.some(choice => choice.id === "VECTOR_RANK"));
            const ranked = applyV21Draft(acquired, "VECTOR_RANK");
            assert.equal(ranked.vectorRank, 2);

            let normalized = createV23InitialBuildState({ hp: 70 });
            const acquireCandidate = enumerateV23ACandidates(2, normalized).find(candidate => candidate.candidateId === "WEAPON_ACQUIRE:VECTOR");
            assert.ok(acquireCandidate);
            normalized = applyV23ACandidate(normalized, acquireCandidate);
            const rankCandidate = enumerateV23ACandidates(3, normalized).find(candidate => candidate.candidateId === "WEAPON_RANK:VECTOR:1->2");
            assert.ok(rankCandidate);
            normalized = applyV23ACandidate(normalized, rankCandidate);
            assert.equal(normalized.weapons.VECTOR?.rank, 2);
          });

          test("VECTOR rank adapter rejects unowned and max-rank transitions", () => {
            const unowned = { deltaRank: 1, hp: 80, maxHp: 100, pickupRadius: 76, vectorEnabled: true, vectorOwned: false, vectorRank: 0 };
            assert.throws(() => applyV21Draft(unowned, "VECTOR_RANK"), /before acquisition/u);
            const maxed = { ...unowned, vectorOwned: true, vectorRank: 5 };
            assert.throws(() => applyV21Draft(maxed, "VECTOR_RANK"), /already Rank V/u);
          });
          '''.replace("          ", "")
          Path("games/rare-shift/tests/v2-3b2-vector-ranks.test.ts").write_text(test_source)

          browser_source = r'''import assert from "node:assert/strict";
          import { mkdir } from "node:fs/promises";
          import { resolve } from "node:path";
          import { testGame } from "@rarefriends/friendsdk/testing";

          const gameDirectory = resolve("games/rare-shift");
          await mkdir(resolve("artifacts"), { recursive: true });

          function bool(value) {
            assert.ok(value === "true" || value === "false", `expected dataset boolean, got ${String(value)}`);
            return value === "true";
          }
          function list(value) { return String(value ?? "").split(",").filter(Boolean); }
          function centers(count) {
            if (count === 1) return [480];
            if (count === 2) return [350, 610];
            if (count === 3) return [220, 480, 740];
            throw new Error(`unexpected draft count ${count}`);
          }
          async function clickDraft(canvas, index, count) {
            const box = await canvas.boundingBox(); assert.ok(box);
            await canvas.click({ position: { x: box.width * centers(count)[index] / 960, y: box.height * 320 / 640 } });
          }
          async function shift(canvas, width) {
            if (width === 390) {
              const box = await canvas.boundingBox(); assert.ok(box);
              await canvas.click({ position: { x: box.width * 842 / 960, y: box.height * 530 / 640 } });
            } else await canvas.press("Space");
          }
          async function applyFixture(canvas, rank, scenario = "default") {
            await canvas.evaluate((_, input) => {
              const fn = window.__rareShiftVectorQualifier;
              if (typeof fn !== "function") throw new Error("VECTOR qualification fixture missing");
              fn(input.rank, input.scenario);
            }, { rank, scenario });
          }
          async function waitForNumber(page, data, name, minimum, timeout = 8000) {
            const deadline = Date.now() + timeout;
            while (Date.now() < deadline) {
              const value = Number(await data(name));
              if (value >= minimum) return value;
              await page.waitForTimeout(80);
            }
            throw new Error(`${name} did not reach ${minimum}; final=${await data(name)}`);
          }
          async function reachDraft(page, canvas, data, width, expectedLevel, timeout = 60000) {
            const route = ["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp"];
            let routeIndex = 0;
            const deadline = Date.now() + timeout;
            while (Date.now() < deadline && !bool(await data("draft-open"))) {
              if (bool(await data("dead"))) throw new Error(`died before Level ${expectedLevel} draft; level=${await data("level")}; hp=${await data("hp")}`);
              await canvas.press(route[routeIndex % route.length], { delay: 420 });
              routeIndex += 1;
              await page.waitForTimeout(1200);
              if (routeIndex % 2 === 0 && !bool(await data("draft-open"))) { await shift(canvas, width); await page.waitForTimeout(100); }
            }
            assert.equal(await data("draft-open"), "true");
            assert.equal(await data("level"), String(expectedLevel));
          }

          function qualify(width) {
            return async ({ page, game }) => {
              await game.locator('[data-stage="scan"]').waitFor({ state: "visible" });
              const reduceMotion = game.getByRole("checkbox", { name: /Reduce motion/i });
              if (width === 390) { await reduceMotion.check(); assert.equal(await reduceMotion.isChecked(), true); }
              await game.getByRole("button", { name: /ENTER SIGNAL DESCENT/i }).click();
              const canvas = game.locator("canvas"); await canvas.waitFor({ state: "visible" }); await canvas.focus();
              const data = name => canvas.getAttribute(`data-${name}`);

              await reachDraft(page, canvas, data, width, 2);
              let ids = list(await data("draft-ids"));
              let count = Number(await data("draft-count"));
              const vectorAcquire = ids.indexOf("VECTOR_NEEDLE");
              assert.ok(vectorAcquire >= 0, `VECTOR_NEEDLE missing: ${ids.join(",")}`);
              await clickDraft(canvas, vectorAcquire, count);
              assert.equal(await data("vector-owned"), "true");
              assert.equal(await data("vector-rank"), "1");

              await reachDraft(page, canvas, data, width, 3, 70000);
              ids = list(await data("draft-ids")); count = Number(await data("draft-count"));
              const vectorRank = ids.indexOf("VECTOR_RANK");
              assert.ok(vectorRank >= 0, `VECTOR_RANK missing from natural Level-3 route: ${ids.join(",")}`);
              const shotsBeforeRank = Number(await data("vector-shots"));
              await clickDraft(canvas, vectorRank, count);
              assert.equal(await data("vector-rank"), "2");
              assert.equal(Number(await data("vector-shots")), shotsBeforeRank, "rank selection must not manufacture a free projectile");
              console.log(`RARE_SHIFT_V2_3B2_NATURAL_VECTOR_RANK2_${width}=PASS`);
              await page.locator(".rf-game-frame").screenshot({ path: resolve(`artifacts/rare-shift-v2-3b2-natural-rank2-${width}.png`) });

              await applyFixture(canvas, 2);
              await waitForNumber(page, data, "vector-penetration-hits", 1);
              assert.deepEqual(list(await data("vector-last-shot-target-ids")), ["9001", "9002"]);
              assert.equal(await data("vector-last-shot-damage"), "10,7");
              console.log(`RARE_SHIFT_V2_3B2_CLEAN_LINE_${width}=PASS`);

              await applyFixture(canvas, 3);
              assert.equal(await data("vector-target-id"), "9002", "TRACE priority target must beat nearer aligned SPLIT inside D+120");
              assert.equal(await data("vector-target-kind"), "TRACE");
              await page.locator(".rf-game-frame").screenshot({ path: resolve(`artifacts/rare-shift-v2-3b2-priority-rank3-${width}.png`) });
              console.log(`RARE_SHIFT_V2_3B2_PRIORITY_TRACE_${width}=PASS`);

              await applyFixture(canvas, 4, "expiry");
              const expiryShots = Number(await data("vector-shots"));
              await shift(canvas, width);
              assert.equal(await data("vector-transfer-armed"), "true");
              await page.waitForTimeout(1300);
              assert.equal(await data("vector-transfer-armed"), "false");
              assert.equal(Number(await data("vector-shots")), expiryShots, "expired no-target transfer must create no projectile/backlog");
              console.log(`RARE_SHIFT_V2_3B2_TRANSFER_EXPIRY_${width}=PASS`);

              await applyFixture(canvas, 4, "transfer");
              await shift(canvas, width);
              await waitForNumber(page, data, "vector-transfer-shots", 1);
              assert.equal(await data("vector-last-shot-transfer"), "true");
              assert.equal(await data("vector-last-shot-target-ids"), "9001,9002,9003");
              assert.equal(await data("vector-last-shot-damage"), "10,7,5");
              await page.locator(".rf-game-frame").screenshot({ path: resolve(`artifacts/rare-shift-v2-3b2-transfer-rank4-${width}.png`) });
              console.log(`RARE_SHIFT_V2_3B2_PHASE_TRANSFER_${width}=PASS`);

              await applyFixture(canvas, 5);
              assert.equal(await data("vector-qualification-synthetic-hp"), "true");
              await waitForNumber(page, data, "vector-lock-stacks", 3, 6000);
              const deadline = Date.now() + 5000;
              while (Date.now() < deadline && !String(await data("vector-last-shot-damage")).startsWith("16")) await page.waitForTimeout(100);
              assert.ok(String(await data("vector-last-shot-damage")).startsWith("16"), `Rank-V locked shot did not reach 16: ${await data("vector-last-shot-damage")}`);
              assert.equal(await data("vector-lock-target-id"), "9001");
              await page.locator(".rf-game-frame").screenshot({ path: resolve(`artifacts/rare-shift-v2-3b2-lock-rank5-${width}.png`) });
              console.log(`RARE_SHIFT_V2_3B2_VECTOR_LOCK_${width}=PASS`);
              if (width === 390) console.log("RARE_SHIFT_V2_3B2_REDUCED_MOTION=PASS");
            };
          }

          for (const width of [960, 390]) {
            await testGame(gameDirectory, {
              width,
              height: width === 960 ? 800 : 844,
              timeout: 125_000,
              screenshot: resolve(`artifacts/rare-shift-v2-3b2-host-${width}.png`),
              check: qualify(width),
            });
          }
          '''.replace("          ", "")
          Path("scripts/v2-3b2-vector-browser.mjs").write_text(browser_source)

          workflow = r'''name: RARE SHIFT V2-3B2 VECTOR Qualification

          on:
            push:
              branches:
                - feature/v2-3b2-vector-ranks
              paths:
                - ".github/workflows/v2-3b2-vector-qualification.yml"
                - "games/rare-shift/**"
                - "scripts/v2-art00-generate.mjs"
                - "scripts/v2-art00-browser.mjs"
                - "scripts/v2-1-browser.mjs"
                - "scripts/v2-2a-browser.mjs"
                - "scripts/v2-2b-browser.mjs"
                - "scripts/v2-2c-browser.mjs"
                - "scripts/v2-2d-browser.mjs"
                - "scripts/v2-2e-browser.mjs"
                - "scripts/v2-3b1-delta-browser.mjs"
                - "scripts/v2-3b2-vector-browser.mjs"
                - "package.json"
                - "tsconfig.core.json"
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            qualify:
              name: FriendSDK + V2-3B2 VECTOR ranks
              runs-on: ubuntu-latest
              timeout-minutes: 70
              container:
                image: mcr.microsoft.com/playwright:v1.63.0-noble
                options: --init
              env:
                PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
                FRIENDSDK_ARCHIVE: vendor/rarefriends-friendsdk-0.1.2.tgz
                FRIENDSDK_SHA256: a6352e187916089b6829c5387fe87f386c5774004f181990e4e3c8ae641cfe83
                FRIENDSDK_URL: https://github.com/spokesz/friendsdk/releases/download/v0.1.2/rarefriends-friendsdk-0.1.2.tgz

              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Use Node.js 24
                  uses: actions/setup-node@v4
                  with:
                    node-version: "24"
                - name: Fetch and verify FriendSDK v0.1.2
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p vendor
                    curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 --output "$FRIENDSDK_ARCHIVE" "$FRIENDSDK_URL"
                    printf '%s  %s\n' "$FRIENDSDK_SHA256" "$FRIENDSDK_ARCHIVE" | sha256sum --check --strict
                - name: Install project dependencies
                  run: npm install --no-audit --no-fund
                - name: Qualification script syntax
                  shell: bash
                  run: |
                    node --check scripts/v2-art00-generate.mjs
                    node --check scripts/v2-art00-browser.mjs
                    node --check scripts/v2-1-browser.mjs
                    node --check scripts/v2-2a-browser.mjs
                    node --check scripts/v2-2b-browser.mjs
                    node --check scripts/v2-2c-browser.mjs
                    node --check scripts/v2-2d-browser.mjs
                    node --check scripts/v2-2e-browser.mjs
                    node --check scripts/v2-3b1-delta-browser.mjs
                    node --check scripts/v2-3b2-vector-browser.mjs
                - name: Inherited deterministic core tests
                  run: npm run test:core
                - name: Inherited V2 combat deterministic contracts
                  run: npm run test:v2-combat
                - name: V2-2E cross-weapon deterministic matrix
                  run: npm run test:v2-2e-cross
                - name: V2-2 draft pointer regression
                  run: npm run test:v2-2-pointer
                - name: V2-3A progression contracts
                  run: npm run test:v2-3a
                - name: V2-3B1 DELTA deterministic contracts
                  run: npm run test:v2-3b1-delta
                - name: V2-3B2 VECTOR deterministic contracts
                  run: npm run test:v2-3b2-vector
                - name: V2 ART 00 regression
                  shell: bash
                  run: |
                    npm run test:v2-art
                    npm run proof:v2-art
                    npm run test:v2-art-browser
                - name: TypeScript qualification
                  shell: bash
                  run: |
                    npm run typecheck:core
                    npm run typecheck
                - name: FriendSDK check build smoke
                  shell: bash
                  run: |
                    npm run check
                    npm run build
                    npm run test:sdk
                - name: V2-1 regression browser proof
                  run: npm run test:v2-1-browser
                - name: V2-2A Vector regression browser proof
                  run: npm run test:v2-2a-browser
                - name: V2-2B Orbit regression browser proof
                  run: npm run test:v2-2b-browser
                - name: V2-2C Echo regression browser proof
                  run: npm run test:v2-2c-browser
                - name: V2-2D Signal Arc regression browser proof
                  run: npm run test:v2-2d-browser
                - name: V2-2E integrated four-slot regression proof
                  run: npm run test:v2-2e-browser
                - name: V2-3B1 DELTA natural higher-rank regression
                  run: npm run test:v2-3b1-delta-browser
                - name: V2-3B2 VECTOR natural and controlled higher-rank proof
                  run: npm run test:v2-3b2-vector-browser
                - name: Upload V2-3B2 evidence
                  uses: actions/upload-artifact@v4
                  with:
                    name: rare-shift-v2-3b2-evidence-__RUN_ID__
                    path: artifacts/
                    if-no-files-found: error
                    retention-days: 14
          '''.replace("          ", "")
          workflow = workflow.replace("__RUN_ID__", "${" + "{ github.run_id }}")
          Path(".github/workflows/v2-3b2-vector-qualification.yml").write_text(workflow)

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          scripts = package.setdefault("scripts", {})
          scripts["test:v2-3b2-vector"] = "node --experimental-strip-types --test games/rare-shift/tests/v2-3b2-vector-ranks.test.ts"
          scripts["test:v2-3b2-vector-browser"] = "node --experimental-strip-types scripts/v2-3b2-vector-browser.mjs"
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          Path(".github/workflows/v2-3b2-apply.yml").unlink()
          PY

          git diff --check
          git status --short
          git config user.name "Zev"
          git config user.email "214125688+ZevlagGerald@users.noreply.github.com"
          git add -A
          git commit -m "feat(v2-3b2): implement VECTOR ranks II-V"
          git push origin HEAD:feature/v2-3b2-vector-ranks
