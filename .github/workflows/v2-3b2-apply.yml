name: V2-3B2 bounded implementation applier

on:
  push:
    branches:
      - feature/v2-3b2-vector-ranks
    paths:
      - ".github/workflows/v2-3b2-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded runtime patch
        run: python scripts/v2-3b2-apply.py
      - name: Verify patch and publish exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "Zev"
          git config user.email "214125688+ZevlagGerald@users.noreply.github.com"
          git add -A
          git commit -m "feat(v2-3b2): integrate VECTOR ranks II-V"
          git push origin HEAD:feature/v2-3b2-vector-ranks
