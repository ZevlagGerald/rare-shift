            assert.deepEqual(lock, { targetId: 1, stacks: 3 });
            assert.deepEqual(advanceVectorLockAfterPrimaryHit(lock, { id: 8, kind: "SPLIT_B", active: true, x: 100, y: 0 }, "A", 0, 0), { targetId: null, stacks: 0 });
