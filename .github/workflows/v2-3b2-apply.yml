            assert.equal(acquireVectorTargetForRank(candidates, "A", 0, 0, 3)?.id, 4);
            assert.equal(acquireVectorTargetForRank([...candidates].reverse(), "A", 0, 0, 3)?.id, 4);
            const outside = [{ ...candidates[0] }, { ...candidates[1], x: 221 }];
