name: RARE SHIFT CR-3D Results

on:
  push:
    branches:
      - feature/cr3d-results
    paths:
      - ".github/workflows/cr3d-results.yml"
      - "docs/design/RARE_SHIFT_CR3D_RESULTS_GATE_v1.md"
      - "games/rare-shift/src/cr3-results-core.ts"
      - "games/rare-shift/src/cr3-results-phaser-runtime.ts"
      - "games/rare-shift/src/cr3-results-ui.tsx"
      - "games/rare-shift/cr3-results.css"
      - "games/rare-shift/v2.tsx"
      - "games/rare-shift/tests/cr-3-results-core.test.ts"
      - "scripts/cr3-results-browser.mjs"
      - "package.json"
      - "tsconfig.core.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-cr3d-results:
    name: CR-3D terminal results lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 160
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      FRIENDSDK_ARCHIVE: vendor/rarefriends-friendsdk-0.1.3.tgz
      FRIENDSDK_SHA256: 8f156c469a15786e3c649b35d092e86ec6242ff30415b7ee7c451763a816e789
      FRIENDSDK_URL: https://github.com/spokesz/friendsdk/releases/download/v0.1.3/rarefriends-friendsdk-0.1.3.tgz

    steps:
      - name: Checkout exact CR-3D head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Trust workspace and verify clean committed candidate
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "CR3D_HEAD=$(git rev-parse HEAD)"
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --short)"

      - name: Fetch and verify FriendSDK v0.1.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 --output "$FRIENDSDK_ARCHIVE" "$FRIENDSDK_URL"
          printf '%s  %s\n' "$FRIENDSDK_SHA256" "$FRIENDSDK_ARCHIVE" | sha256sum --check --strict

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: CR-3 deterministic boss pressure and result authority
        shell: bash
        run: |
          npm run test:cr-3a
          npm run test:cr-3c
          npm run test:cr-3d

      - name: Inherited deterministic regression through B5 and Evolution
        shell: bash
        run: |
          npm run test:cr-1
          npm run test:cr-2a
          npm run test:evolution
          npm run test:core
          npm run test:v2-combat
          npm run test:v2-2e-cross
          npm run test:v2-2-pointer
          npm run test:v2-3a
          npm run test:v2-3b1-delta
          npm run test:v2-3b2-vector
          npm run test:v2-3b3-orbit
          npm run test:v2-3b4-echo
          npm run test:v2-3b5-signal

      - name: TypeScript qualification
        shell: bash
        run: |
          npm run typecheck:core
          npm run typecheck

      - name: FriendSDK check and build
        shell: bash
        run: |
          npm run check
          npm run build

      - name: Inherited baseline browser regression
        run: npm run test:v2-1-browser

      - name: Inherited B5 SHIFT and SIGNAL browser regression
        run: npm run test:v2-3b5-signal-browser

      - name: Inherited natural Evolution wrapper regression
        run: node --experimental-strip-types scripts/evolution-natural-selection-browser.mjs

      - name: Inherited CR-3B boss legality browser regression
        run: npm run test:cr-3b-browser

      - name: Inherited CR-3C pressure browser regression
        run: npm run test:cr-3c-browser

      - name: CR-3D terminal results browser qualification
        run: npm run test:cr-3d-browser
